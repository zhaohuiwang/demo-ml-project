[project]
name = "demo-ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhaohuiwang", email = "ezhwang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "easydict>=1.13",
    "fastapi[standard]>=0.115.12",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "jsonschema>=4.24.0",
    "matplotlib>=3.10.3",
    "omegaconf>=2.3.0",
    "pytest>=8.4.1",
    "pydantic>=2.11.5",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "python-dotenv>=1.1.1",
    "joblib>=1.5.3",
    "filelock>=3.20.2",
    "optuna>=4.6.0",
    "scikit-learn>=1.8.0",
    "fastparquet>=2025.12.0",
    "shap>=0.49.1",
    "torchinfo>=1.8.0",
    "statsmodels>=0.14.6",
    "feast>=0.59.0",
    "hydra-zen>=0.16.0",
    "pytest-cov>=7.0.0",
    "mlflow>=3.9.0",
]

[project.scripts]
demo-ml-project = "demo_ml_project:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
