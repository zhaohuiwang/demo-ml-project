[project]
name = "demo-ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhaohuiwang", email = "ezhwang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "easydict>=1.13",
    "fastapi[standard]>=0.115.12",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "jsonschema>=4.24.0",
    "matplotlib>=3.10.3",
    "omegaconf>=2.3.0",
    "pytest>=8.4.1",
    "pydantic>=2.11.5",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "python-dotenv>=1.1.1",
    "joblib>=1.5.3",
    "filelock>=3.20.2",
    "optuna>=4.6.0",
    "scikit-learn>=1.8.0",
    "fastparquet>=2025.12.0",
    "shap>=0.49.1",
    "torchinfo>=1.8.0",
    "statsmodels>=0.14.6",
    "feast>=0.59.0",
    "hydra-zen>=0.16.0",
    "pytest-cov>=7.0.0",
    "mlflow>=3.9.0",
    "black>=26.1.0",
]

[project.scripts]
demo-ml-project = "demo_ml_project:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_ml_project"]



# Python uses the build backend (Hatchling) to create a wheel. (Python installs packages from wheels. This project is also treated as a package).
# What a “Wheel” Is: A wheel contains: 1. compiled binaries (if needed) 2. package files 3. metadata. Installing from a wheel is basically unzipping files, which is very fast.
# How uv Is Different: uv maintains a shared global cache for all Python environments on your machine (~/.cache/uv).

# editable install behavior: uv installs packages specified dependencies mormally as wheels into site-packages. Those are not editable. When you run `uv sync` you will see `demo_ml_projectr==0.1.0 (from file:///home/zhaohuiwang/dev/demo_ml_project)` You local project is in the path specified in the parentheses is referred as `demo_ml_projectr==0.1.0`. Any edits you make in your local project are immediately visible in python without reinstalling. Now you can `from schwab_trader.utils.db import init_db; import sachwab_trader`. So editable install behavior is basically a link (via a .pth file) from the virtual environment to your local project.

