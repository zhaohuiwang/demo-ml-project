# conf/inference/default.yaml

target_cols:
  - breast
  - lung_and_bronchus
  - melanoma_of_the_skin

project_root: ${hydra:runtime.cwd}

load_from: mlflow

num_workers: 0
batch_size: 256
device: null  # null = auto (cuda > mps > cpu)

local:
  export_dir: model_export/latest

mlflow:
  model_name: TabularMultiTargetRegressor
  version: latest
  alias: champion

input:
  path: data/processed/model_df.parquet
  format: auto  # auto, csv, parquet

output:
  path: predictions.csv
  include_index: true
  columns_prefix: pred_

feast:
  repo_path: feature_repo
  entity_column: sample_id
  feature_service: inference_features