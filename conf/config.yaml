
# project-root(demo-ml-project)/conf/config.yaml
# conf/config.yaml

defaults:
  - _self_ # important: root config overrides come last
  - data: default
  - training: default
  - optuna: default
  - export: default

project_root: ${hydra:runtime.cwd} # or use hydra.utils.get_original_cwd() if needed

seed: 42
device: cuda   # or auto-detect in code

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: sweeps/${now:%Y-%m-%d}
    subdir: ${hydra.job.name}.${now:%H-%M-%S}