

version: "3.9"

services:
  training:
    build:
      context: .
      dockerfile: Dockerfile
    image: demo-ml-tabular:latest
    command: python scripts/train.py
    # For GPU support (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./mlruns:/app/mlruns
      - ./model_export:/app/model_export
      - ./data:/app/data:ro           # read-only for input data
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow
    # Optional: restart on failure during dev
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0  # latest stable as of early 2025
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    environment:
      - MLFLOW_TRACKING_USERNAME=admin     # optional basic auth
      - MLFLOW_TRACKING_PASSWORD=secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: MinIO for S3-style artifact storage (uncomment if needed)
  # minio:
  #   image: minio/minio:RELEASE.2025-01-01T00-00-00Z
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3

volumes:
  mlruns:
  minio-data: